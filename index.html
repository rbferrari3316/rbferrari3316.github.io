<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Academic homepage of Yueting Deng, undergraduate student at Lanzhou University." />
  <title>Yueting Deng</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #7a271a;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.4rem;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 1.08rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .section {
      margin-top: 34px;
    }

    h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .tag {
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.95rem;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 14px;
      }

      .card {
        padding: 26px 22px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Yueting Deng</h1>

      <div class="subtitle">
        Undergraduate Student<br />
        School of Information Science and Engineering, Lanzhou University
      </div>

      <div class="section">
        <h2>Contact</h2>
        <p>
          Email:
          <a href="mailto:320220919820@lzu.edu.cn">320220919820@lzu.edu.cn</a>
        </p>
      </div>

      <div class="section">
        <h2>Research Interests</h2>
        <div class="tag-list">
          <span class="tag">Multi-Agent Reinforcement Learning</span>
          <span class="tag">Reinforcement Learning</span>
          <span class="tag">Spatio-temporal Modeling</span>
          <span class="tag">Intelligent Control</span>
        </div>
      </div>
    </section>

    <footer>
      © Yueting Deng
    </footer>
  </main>
</body>
</html>
